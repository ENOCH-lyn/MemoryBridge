# OpenResty server block used for the public deployment.
# Place it in a conf.d directory included by nginx (1Panel:
# /opt/1panel/www/conf.d/mcp.enoch.host.conf).
# Cloudflare proxies mcp.enoch.host -> origin :443 (or :80).
# This example uses a self-signed origin cert, which requires Cloudflare SSL/TLS
# mode "Full" (not "Full (strict)").
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name mcp.enoch.host;
    server_tokens off;
    client_max_body_size 16m;

    access_log /www/sites/mcp.enoch.host/log/access.log main;
    error_log /www/sites/mcp.enoch.host/log/error.log;

    ssl_certificate /www/sites/mcp.enoch.host/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/mcp.enoch.host/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Cloudflare supplies the real client address; direct origin access
        # should be restricted to Cloudflare IP ranges at the firewall.
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
