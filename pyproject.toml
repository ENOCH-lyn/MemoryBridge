[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "membridge"
version = "0.1.0"
description = "Portable agent identity, memory and capability sync over MCP"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MemoryBridge contributors" }]
dependencies = []

[project.scripts]
membridge = "membridge.cli:main"
mb = "membridge.cli:main"

[tool.setuptools]
packages = ["membridge"]
